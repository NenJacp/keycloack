<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page - Oxocarbon Matte</title>
    <script src="https://cdn.jsdelivr.net/npm/keycloak-js@24.0.0/dist/keycloak.min.js"></script>
    <style>
        :root {
            --bg-base: #161616;
            --bg-surface: #262626;
            --text-primary: #f2f2f2;
            --text-secondary: #dde1e6;
            --accent-pink: #ff7eb6;
            --accent-blue: #82cfff;
            --accent-purple: #be95ff;
            --border: #393939;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-base); 
            color: var(--text-primary);
            display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; 
        }

        /* Estilo Mate: Sin sombras brillantes */
        .card { 
            background: var(--bg-surface); padding: 2.5rem; border-radius: 4px; border: 1px solid var(--border);
            text-align: center; max-width: 450px; width: 90%;
        }

        h1 { color: var(--accent-blue); margin-bottom: 0.5rem; font-weight: 400; }
        strong { color: var(--accent-pink); }

        .user-info { 
            margin: 1.5rem 0; text-align: left; background: var(--bg-base); padding: 1.2rem; 
            border-radius: 4px; border: 1px solid var(--border); font-family: monospace; font-size: 0.85rem;
        }

        /* Botones Mate: Sin efectos de luz */
        button { 
            background-color: transparent; color: var(--accent-blue); border: 1px solid var(--accent-blue); 
            padding: 12px 24px; border-radius: 4px; cursor: pointer; font-weight: 500; width: 100%; margin-top: 10px;
            transition: background 0.2s ease;
        }

        button:hover { background-color: rgba(130, 207, 255, 0.1); }
        
        .btn-pink { color: var(--accent-pink); border-color: var(--accent-pink); }
        .btn-pink:hover { background-color: rgba(255, 126, 182, 0.1); }

        /* Modal Mate */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9); align-items: center; justify-content: center;
        }

        .modal-content {
            background: var(--bg-surface); padding: 2rem; border-radius: 4px; border: 1px solid var(--border);
            max-width: 400px; text-align: left;
        }

        pre { 
            background: var(--bg-base); padding: 15px; border-radius: 4px; border: 1px solid var(--border);
            overflow-x: auto; color: var(--accent-purple); font-size: 0.8rem;
        }
        
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="loading" style="color: var(--accent-pink); font-family: monospace;">❯ Inicializando_seguridad...</div>

    <div id="content" class="card hidden">
        <h1 style="color: var(--accent-blue);">Bienvenido, Usuario</h1>
        <p style="color: var(--text-secondary);">Recurso protegido por <strong>Keycloak_IAM</strong></p>
        
        <div class="user-info">
            <p style="color: var(--accent-purple); margin: 5px 0;">❯ USUARIO: <span id="username" style="color: white;"></span></p>
            <p style="color: var(--accent-purple); margin: 5px 0;">❯ CORREO: <span id="useremail" style="color: white;"></span></p>
        </div>
        
        <button class="btn-pink" onclick="llamarApi()">CONSULTAR_API_PROTEGIDA</button>
        <button onclick="keycloak.logout()">TERMINAR_SESIÓN</button>
    </div>

    <div id="apiModal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--accent-purple); margin-top: 0; font-weight: 400;">Respuesta_Servidor</h2>
            <pre id="apiResponse"></pre>
            <button onclick="cerrarModal()" style="border-color: var(--border); color: var(--text-secondary);">CERRAR_MODAL</button>
        </div>
    </div>

    <script>
        const keycloak = new Keycloak({
            url: 'http://localhost:8080',
            realm: 'LaboratorioDev.',
            clientId: 'frontend-app'
        });

        keycloak.init({ onLoad: 'login-required', checkLoginIframe: false }).then(function(authenticated) {
            if (authenticated) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                document.getElementById('username').innerText = keycloak.tokenParsed.preferred_username;
                document.getElementById('useremail').innerText = keycloak.tokenParsed.email || 'nulo';
            }
        });

        function llamarApi() {
            fetch('http://localhost:3000/api/privado', {
                headers: { 'Authorization': 'Bearer ' + keycloak.token }
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('apiResponse').innerText = JSON.stringify(data, null, 2);
                document.getElementById('apiModal').style.display = 'flex';
            })
            .catch(err => {
                alert('Error al llamar a la API.');
            });
        }

        function cerrarModal() {
            document.getElementById('apiModal').style.display = 'none';
        }
    </script>
</body>
</html>
